[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-api-project"
version = "0.1.0"
description = "FastAPI проект для тренировок"
authors = [{name = "Ваше Имя"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
]

[tool.setuptools]
packages = {find = {where = ["src"]}}
package-dir = {"" = "src"}